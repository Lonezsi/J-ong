<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J-ong</title>
<meta name="theme-color" content="#0F1311">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Orbitron carries the titles: geometric and technical, and the closest openly
     licensed face to the one this was designed around. Upload your own in Settings and
     it is registered as "Jong Display", which the stylesheet asks for first. Manrope
     does everything else: well used, not everywhere, and it holds its shape at twelve
     pixels in a dense track list. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/jong.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2354B37A'/><path d='M12 9v11.2a3.2 3.2 0 1 0 2 3V13l7-2v6.2a3.2 3.2 0 1 0 2 3V7z' fill='%230F1311'/></svg>">
</head>
<body>


<!-- The glass.
     feTurbulence makes a field of smooth noise; feDisplacementMap uses its red and green
     channels to push each pixel of what is behind sideways and up. That is a real
     refraction rather than a blur pretending to be one: straight edges passing under a
     panel bend, which is the thing your eye actually reads as glass.
     Two strengths, because a thin bar wants far less bending than a whole sheet. -->
<svg class="glass-defs" aria-hidden="true" focusable="false">
  <filter id="glass" x="-25%" y="-25%" width="150%" height="150%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2"
                  seed="17" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="26"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glass-thin" x="-25%" y="-25%" width="150%" height="150%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2"
                  seed="9" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="12"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="nav-bar" id="navBar" hidden><span></span></div>

<!-- The song's own artwork, enormous and far out of focus, behind the entire app.
     Fixed to the page rather than to the panel, so the rail and the player have
     something with colour in it to refract, which is what makes them read as glass. -->
<div class="page-wash" id="pageWash" aria-hidden="true"></div>

<div id="app" class="shell">

  <aside class="rail" id="rail">
    <div class="rail-top">
      <a class="wordmark" href="#/" data-link>J-ong</a>
      <button class="icon-btn rail-close" id="railClose" aria-label="Close menu">&times;</button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="rail-section" id="railAlbums"></div>
    <div class="rail-section" id="railPlaylists"></div>

    <div class="rail-foot">
      <button class="btn sm" id="newSong">New song</button>
      <button class="rail-keys" id="railKeys" title="Keyboard shortcuts">?</button>
      <span class="rail-version" id="railVersion"></span>
    </div>
  </aside>

  <div class="rail-scrim" id="railScrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn rail-open" id="railOpen" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search your songs" aria-label="Search songs" autocomplete="off">
      </div>
      <span class="grow"></span>
      <span class="update-dot" id="updateDot" hidden></span>
    </header>

    <div class="view" id="view"></div>
  </main>

  <footer class="player" id="player" hidden></footer>
</div>

<div class="sheet-backdrop" id="modalBackdrop" hidden></div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script src="/jong.js"></script>
</body>
</html>
