<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J-ong</title>
<meta name="theme-color" content="#0F1311">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/jong.css">
<style>
/* The door. It borrows the app's tokens and adds nothing of its own but a layout. */
body { display: grid; place-items: center; min-height: 100dvh; padding: var(--s4); }
.door {
  width: min(380px, 100%);
  background: var(--surface);
  border-radius: var(--r-xl);
  padding: var(--s7) var(--s6) var(--s6);
  box-shadow: var(--shadow-3);
}
.door h1 {
  font-family: var(--display); font-weight: 800; font-size: 34px;
  letter-spacing: -0.03em; margin: 0 0 var(--s2);
}
.door h1::after {
  content: ""; display: inline-block; width: 9px; height: 9px; margin-left: 4px;
  border-radius: 50%; background: var(--accent); vertical-align: 5px;
}
.door p { color: var(--text-2); margin: 0 0 var(--s6); font-size: 14px; line-height: 1.6; }
.door label {
  display: flex; flex-direction: column; gap: 6px;
  font-size: 12.5px; font-weight: 600; color: var(--text-2);
  margin-bottom: var(--s4);
}
.door .btn { width: 100%; height: 44px; }
.note {
  margin: var(--s5) 0 0; font-size: 12.5px; color: var(--text-3); line-height: 1.6;
}
.problem {
  margin: 0 0 var(--s4); padding: 10px var(--s4);
  border-radius: var(--r-md);
  background: rgba(212, 104, 94, 0.12);
  color: #F0A79E; font-size: 13px; font-weight: 600;
}
/* Same reason as the app: an author rule setting display beats the browser's own
   [hidden] rule, and .door label sets display: flex. */
[hidden] { display: none !important; }
</style>
</head>
<body>

<form class="door" id="door" autocomplete="on">
  <h1>J-ong</h1>
  <p id="blurb">Signing in.</p>
  <div class="problem" id="problem" hidden></div>

  <label id="codeField" hidden>
    Setup code
    <input class="field" id="code" name="code" autocomplete="off" spellcheck="false"
           placeholder="printed where the server is running">
  </label>

  <label>
    <span id="passwordLabel">Password</span>
    <input class="field" id="password" name="password" type="password"
           autocomplete="current-password" autofocus>
  </label>

  <button class="btn primary" id="go" type="submit">Sign in</button>

  <p class="note" id="note">
    Any password is accepted, however short. What protects it is that guessing is limited
    to a few tries before this address has to wait.
  </p>
</form>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let mode = "login";

async function api(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const text = await response.text();
  let data = {};
  try { data = JSON.parse(text || "{}"); } catch (e) { data = { error: text.slice(0, 200) }; }
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function problem(message) {
  const box = $("problem");
  box.textContent = message || "";
  box.hidden = !message;
}

async function decideMode() {
  try {
    const state = await (await fetch("/api/auth/state")).json();
    if (state.signed_in) { location.href = "/"; return; }
    mode = state.has_password ? "login" : "setup";
  } catch (e) {
    problem("J-ong is not answering.");
    return;
  }

  const setup = mode === "setup";
  $("codeField").hidden = !setup;
  $("blurb").textContent = setup
    ? "Nobody has set a password on this library yet. Choose one now."
    : "Sign in to your library.";
  $("passwordLabel").textContent = setup ? "Choose a password" : "Password";
  $("password").setAttribute("autocomplete", setup ? "new-password" : "current-password");
  $("go").textContent = setup ? "Set it and open the library" : "Sign in";
  $("note").textContent = setup
    ? "Anything at all, as long as it is not empty. There are no rules about length or "
      + "characters, because guessing is rate limited instead."
    : "Any password is accepted, however short. What protects it is that guessing is "
      + "limited to a few tries before this address has to wait.";
  (setup ? $("code") : $("password")).focus();
}

$("door").addEventListener("submit", async (e) => {
  e.preventDefault();
  problem("");
  const password = $("password").value;
  const button = $("go");
  button.disabled = true;
  try {
    if (mode === "setup") {
      await api("/api/auth/setup", { code: $("code").value.trim(), password });
    } else {
      await api("/api/auth/login", { password });
    }
    location.href = "/";
  } catch (err) {
    problem(err.message);
    button.disabled = false;
    $("password").select();
  }
});

/* The uploaded display face, so the door and the library look like one product. */
fetch("/api/appearance/font", { method: "HEAD" }).then((r) => {
  if (!r.ok) return;
  const style = document.createElement("style");
  style.textContent = '@font-face{font-family:"Jong Display";'
    + 'src:url("/api/appearance/font");font-display:swap}';
  document.head.appendChild(style);
}).catch(() => { /* the open face is a fine door */ });

decideMode();
</script>
</body>
</html>
